server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fixed-name GUI block SVGs under blocks-media are not content-hashed, so
    # they get a short revalidated cache instead of one-year immutable.
    location ~* ^/static/blocks-media/.*\.(svg|png)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Cache static assets excluding index.html
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
